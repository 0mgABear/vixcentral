name: VIX Contango Bot

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run bot (with retries)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          set -e
          attempts=3
          for i in $(seq 1 $attempts); do
            echo "Attempt $i/$attempts..."
            python vixbot.py && exit 0
            code=$?
            echo "Run failed with exit code $code"
            if [ $i -lt $attempts ]; then
              sleep $((i*30))
            fi
          done
          exit $code

      - name: Commit updated data.json (if changed)
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json
          git commit -m "Update data.json $(TZ=Asia/Singapore date +'%Y-%m-%d')"
          git push
